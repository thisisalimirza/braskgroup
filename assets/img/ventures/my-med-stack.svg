<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A leaning stack of program cards, the top one picked out in violet">
  <defs>
    <pattern id="grid-mms" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#0B0B0C" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F7F4FB"/>
  <rect width="800" height="600" fill="url(#grid-mms)"/>

  <!-- The stack, bottom card first. -->
  <g>
    <rect x="168" y="404" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#6A3EA1" stroke-opacity=".22"/>
    <rect x="196" y="430" width="26" height="26" rx="6" fill="#6A3EA1" fill-opacity=".14"/>
    <rect x="240" y="432" width="150" height="8" rx="4" fill="#0B0B0C" fill-opacity=".14"/>
    <rect x="240" y="450" width="96" height="8" rx="4" fill="#0B0B0C" fill-opacity=".08"/>

    <rect x="186" y="306" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#6A3EA1" stroke-opacity=".28"/>
    <rect x="214" y="332" width="26" height="26" rx="6" fill="#6A3EA1" fill-opacity=".2"/>
    <rect x="258" y="334" width="182" height="8" rx="4" fill="#0B0B0C" fill-opacity=".16"/>
    <rect x="258" y="352" width="112" height="8" rx="4" fill="#0B0B0C" fill-opacity=".09"/>

    <rect x="204" y="208" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#6A3EA1" stroke-opacity=".34"/>
    <rect x="232" y="234" width="26" height="26" rx="6" fill="#6A3EA1" fill-opacity=".28"/>
    <rect x="276" y="236" width="160" height="8" rx="4" fill="#0B0B0C" fill-opacity=".18"/>
    <rect x="276" y="254" width="124" height="8" rx="4" fill="#0B0B0C" fill-opacity=".1"/>

    <!-- The picked card. -->
    <rect x="222" y="110" width="440" height="78" rx="12" fill="#6A3EA1"/>
    <rect x="250" y="136" width="26" height="26" rx="6" fill="#FFFFFF" fill-opacity=".9"/>
    <rect x="294" y="138" width="196" height="8" rx="4" fill="#FFFFFF" fill-opacity=".85"/>
    <rect x="294" y="156" width="128" height="8" rx="4" fill="#FFFFFF" fill-opacity=".45"/>
    <circle cx="622" cy="149" r="9" fill="#FF5A1F"/>
  </g>

  <!-- A hairline running the height of the stack. -->
  <path d="M132 110V482" stroke="#6A3EA1" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="132" cy="149" r="5" fill="#6A3EA1"/>
</svg>
