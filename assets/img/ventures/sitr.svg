<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A seating chart with rows of places, some assigned in blue">
  <defs>
    <pattern id="grid-sitr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#0B0B0C" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F2F5FC"/>
  <rect width="800" height="600" fill="url(#grid-sitr)"/>

  <!-- The front of the room. -->
  <rect x="240" y="96" width="320" height="14" rx="7" fill="#0B0B0C" fill-opacity=".16"/>

  <!-- Rows, curving back from the front. Filled squares are
       assigned places; outlined ones are still open. -->
  <g>
    <!-- row 1 -->
    <g transform="translate(0 168)">
      <rect x="196" y="6" width="40" height="40" rx="9" fill="#1F4FA8"/>
      <rect x="252" y="2" width="40" height="40" rx="9" fill="#1F4FA8"/>
      <rect x="308" y="0" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="364" y="0" width="40" height="40" rx="9" fill="#1F4FA8"/>
      <rect x="420" y="0" width="40" height="40" rx="9" fill="#1F4FA8"/>
      <rect x="476" y="2" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="532" y="6" width="40" height="40" rx="9" fill="#1F4FA8"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(0 240)">
      <rect x="182" y="8" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".78"/>
      <rect x="238" y="3" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="294" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".78"/>
      <rect x="350" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".78"/>
      <rect x="406" y="0" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="462" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".78"/>
      <rect x="518" y="3" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".78"/>
      <rect x="574" y="8" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(0 312)">
      <rect x="168" y="10" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="224" y="4" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".55"/>
      <rect x="280" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".55"/>
      <rect x="336" y="0" width="40" height="40" rx="9" fill="#FF5A1F"/>
      <rect x="392" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".55"/>
      <rect x="448" y="0" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".35"/>
      <rect x="504" y="4" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".55"/>
      <rect x="560" y="10" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".55"/>
    </g>
    <!-- row 4 -->
    <g transform="translate(0 384)">
      <rect x="196" y="12" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".3"/>
      <rect x="252" y="5" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".3"/>
      <rect x="308" y="0" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".25"/>
      <rect x="364" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".3"/>
      <rect x="420" y="0" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".3"/>
      <rect x="476" y="5" width="40" height="40" rx="9" fill="#FFFFFF" stroke="#1F4FA8" stroke-opacity=".25"/>
      <rect x="532" y="12" width="40" height="40" rx="9" fill="#1F4FA8" fill-opacity=".3"/>
    </g>
  </g>
</svg>
